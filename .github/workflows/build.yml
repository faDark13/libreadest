name: Build libreadest

# Unsigned desktop builds for every push to main and every tag. No signing
# keys, store credentials or upload steps: artifacts land in the workflow run.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors
      - name: lint and typecheck
        run: pnpm lint
      - name: unit tests
        run: pnpm test

  build:
    if: github.event_name != 'pull_request'
    needs: check
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            args: '--bundles deb'
          - os: windows-latest
            name: windows
            args: '--bundles nsis'
          - os: macos-latest
            name: macos
            args: '--bundles app'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.name }}

      # Linux ships on the CEF runtime; its tauri CLI comes from readest/tauri
      # (see apps/readest-app/scripts/tauri.mjs).
      - name: install the CEF tauri CLI (linux only)
        if: matrix.name == 'linux'
        run: cargo install tauri-cli --git https://github.com/readest/tauri --rev 6beeb209b5514f597a26f48b7a5b9fe4c59b5f12 --locked --force

      - name: install system dependencies (linux only)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libclang-dev g++ libfontconfig-dev \
            libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 \
            libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 \
            libappindicator3-dev librsvg2-dev patchelf xdg-utils libnss3 libpulse0 \
            libspeechd2 libxkbcommon-x11-0

      - name: build
        shell: bash
        env:
          TAURI_CEF_CARGO: ${{ matrix.name == 'linux' && '1' || '0' }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        working-directory: apps/readest-app
        run: pnpm tauri build ${{ matrix.args }}

      - name: upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: libreadest-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/*/release/bundle/**/*
            target/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14
